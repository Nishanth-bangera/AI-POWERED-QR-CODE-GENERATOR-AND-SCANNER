<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QRNISH - Splash Screen</title>
    
    <!-- Link to external fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
    
    <!-- Link to your separate CSS file -->
    <link rel="stylesheet" href="2style.css">
</head>
<body>

    <!-- Subtle Ambient Lighting -->
    <div class="bg-orb orb-blue"></div>
    <div class="bg-orb orb-cyan"></div>

    <div class="Splash-container">
        
        <!-- Clean Viewfinder Text Box -->
        <div class="text-logo-container">
            <div class="corner top-left"></div>
            <div class="corner top-right"></div>
            <div class="corner bottom-left"></div>
            <div class="corner bottom-right"></div>
            <h1 class="app-name">
                <span class="qr-text">QR</span><span class="nish-text">NISHH</span>
            </h1>
        </div>

        <!-- Logo & AI Scanner -->
        <div class="logo-wrapper">
            <div class="scanner-ring"></div>
            
            <!-- SVG is kept inline here so the CSS animations can control it -->
            <svg class="qr-logo" viewBox="0 0 100 100">
                <path class="qr-path qr-path-blue" d="M 10 10 H 35 V 35 H 10 Z" />
                <path class="qr-path qr-path-cyan" d="M 18 18 H 27 V 27 H 18 Z" />
                <path class="qr-path qr-path-blue" d="M 65 10 H 90 V 35 H 65 Z" />
                <path class="qr-path qr-path-cyan" d="M 73 18 H 82 V 27 H 73 Z" />
                <path class="qr-path qr-path-blue" d="M 10 65 H 35 V 90 H 10 Z" />
                <path class="qr-path qr-path-cyan" d="M 18 73 H 27 V 82 H 18 Z" />
                <path class="qr-path qr-path-cyan" d="M 40 40 H 60 V 60 H 40 Z" />
                <path class="qr-path qr-path-blue" d="M 45 45 H 55 V 55 H 45 Z" />
                <path class="qr-path qr-path-blue" d="M 90 55 V 90 H 55" />
                <path class="qr-path qr-path-cyan" d="M 65 90 V 75 H 80" />
            </svg>
        </div>

        <!-- Creative Thought & Tagline -->
        <div class="creative-word">» Generate • Scan • Connect «</div>
        <p class="tagline">AI Powered QR Generator & Scanner</p>

    </div>

    <!-- Link to your separate JavaScript file -->
    <script src="3script.js"></script>
</body>
</html>
