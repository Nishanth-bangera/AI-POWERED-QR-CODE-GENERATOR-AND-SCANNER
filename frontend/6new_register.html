<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | QRNISH</title>

    <link rel="stylesheet" href="7register.css">

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;900&display=swap"
          rel="stylesheet">
</head>

<body>

    <div class="bg-orb orb-blue"></div>
    <div class="bg-orb orb-cyan"></div>

    <div class="auth-container">
        <div class="auth-card">

            <div class="header-row">

                <div class="mini-logo">
                    <svg class="qr-logo" viewBox="0 0 100 100">

                        <path class="qr-path qr-path-blue"
                              d="M 10 10 H 35 V 35 H 10 Z" />

                        <path class="qr-path qr-path-cyan"
                              d="M 18 18 H 27 V 27 H 18 Z" />

                        <path class="qr-path qr-path-blue"
                              d="M 65 10 H 90 V 35 H 65 Z" />

                        <path class="qr-path qr-path-cyan"
                              d="M 73 18 H 82 V 27 H 73 Z" />

                        <path class="qr-path qr-path-blue"
                              d="M 10 65 H 35 V 90 H 10 Z" />

                        <path class="qr-path qr-path-cyan"
                              d="M 18 73 H 27 V 82 H 18 Z" />

                        <path class="qr-path qr-path-cyan"
                              d="M 40 40 H 60 V 60 H 40 Z" />

                        <path class="qr-path qr-path-blue"
                              d="M 45 45 H 55 V 55 H 45 Z" />

                        <path class="qr-path qr-path-blue no-fill"
                              d="M 90 55 V 90 H 55" />

                        <path class="qr-path qr-path-cyan no-fill"
                              d="M 65 90 V 75 H 80" />

                    </svg>
                </div>

                <div class="title-container">

                    <h1>
                        <span class="qr-text">QR</span><span class="nish-text">NISH</span>
                    </h1>

                </div>

            </div>

            <p class="subtitle">Create your account</p>


            <form id="registerForm" onsubmit="event.preventDefault();">


                <!-- FULL NAME -->

                <div class="input-group">

                    <label for="fullname">Full Name</label>

                    <input
                        type="text"
                        id="fullname"
                        placeholder="John Doe"
                        required>

                </div>


                <!-- MOBILE NUMBER -->

                <div class="input-group">

                    <label for="mobile">Mobile Number</label>

                    <input
                        type="tel"
                        id="mobile"
                        placeholder="+91 9876543210"
                        required>

                </div>


                <!-- EMAIL -->

                <div class="input-group">

                    <label for="email">Email Address</label>

                    <div class="mobile-input-wrapper">

                        <input
                            type="email"
                            id="email"
                            placeholder="you@example.com"
                            required>

                        <button
                            type="button"
                            class="btn-secondary"
                            id="send-otp-btn">

                            Send OTP

                        </button>

                    </div>

                </div>


                <!-- EMAIL OTP -->

                <div
                    class="input-group"
                    id="otp-section"
                    style="display:none;">

                    <label for="otp">Enter Email OTP</label>

                    <div class="mobile-input-wrapper">

                        <input
                            type="text"
                            id="otp"
                            placeholder="Enter 6-digit OTP"
                            maxlength="6"
                            inputmode="numeric">

                        <button
                            type="button"
                            class="btn-secondary"
                            id="verify-otp-btn">

                            Verify OTP

                        </button>

                    </div>

                    <small id="otp-status"></small>

                </div>


                <!-- PASSWORD -->

                <div class="input-group">

                    <label for="password">Password</label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            placeholder="••••••••"
                            required>

                        <button
                            type="button"
                            class="toggle-password"
                            data-target="password">

                            <svg
                                width="20"
                                height="20"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2">

                                <path
                                    d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z">
                                </path>

                                <circle
                                    cx="12"
                                    cy="12"
                                    r="3">
                                </circle>

                            </svg>

                        </button>

                    </div>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="input-group">

                    <label for="confirm-password">
                        Confirm Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="confirm-password"
                            placeholder="••••••••"
                            required>

                        <button
                            type="button"
                            class="toggle-password"
                            data-target="confirm-password">

                            <svg
                                width="20"
                                height="20"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2">

                                <path
                                    d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z">
                                </path>

                                <circle
                                    cx="12"
                                    cy="12"
                                    r="3">
                                </circle>

                            </svg>

                        </button>

                    </div>

                </div>


                <!-- ERROR / STATUS -->

                <div id="error"></div>


                <!-- CREATE ACCOUNT -->

                <button
                    type="submit"
                    class="btn-primary"
                    id="create-account-btn">

                    Create Account

                </button>

            </form>


            <div class="divider">

                <span>OR</span>

            </div>


            <div id="googleBtn"></div>


            <p class="auth-footer">

                Already have an account?

                <a href="4login.html">
                    Login
                </a>

            </p>

        </div>
    </div>


    <!-- GOOGLE LOGIN -->

    <script
        src="https://accounts.google.com/gsi/client"
        async>
    </script>

    <script src="google-login.js"></script>


    <!-- QRNISH REGISTRATION JAVASCRIPT -->

    <script src="8register.js"></script>

</body>
</html>
